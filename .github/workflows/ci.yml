name: CI

# Skyddar vuxenappen (repo-roten): typkontroll, tester, oförändrade simulerade matcher och produktionsbygge.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  outbreak:
    name: Outbreak (root app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Deterministiska matcher (gång/cykel × svårighet × läge × seeds). En avsiktlig regeländring uppdaterar referensfilen i samma PR.
      - name: Regression fingerprint
        run: npx tsx scripts/regression-fingerprint.ts | diff -u scripts/regression-fingerprint.expected.txt -
      # Campaign voice script and the list of recorded lines match the campaign definitions and the files in public/campaign.
      - run: npm run campaign:voice -- --check
      - run: npm run build

  mini:
    name: Mini Outbreak (apps/mini)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Hoppar över resten när inget som barnappen bygger på eller importerar (transitivt) har ändrats. Jobbet blir ändå grönt.
      - name: Affects Mini Outbreak?
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if node apps/mini/scripts/ignore-build.mjs --ci --base "$BASE" --head "$GITHUB_SHA"; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      # Beroenden installeras bara i repo-roten: barnappen och delad kod ska använda samma React.
      - if: steps.affected.outputs.run == 'true'
        run: npm ci
      - if: steps.affected.outputs.run == 'true'
        run: npm run typecheck
        working-directory: apps/mini
      - if: steps.affected.outputs.run == 'true'
        run: npx tsc -p apps/mini --noEmit --noUnusedLocals --noUnusedParameters
      - if: steps.affected.outputs.run == 'true'
        run: npm test
        working-directory: apps/mini
      - if: steps.affected.outputs.run == 'true'
        run: npm run build
        working-directory: apps/mini
